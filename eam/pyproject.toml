[project]
name = "eam"
version = "0.1.0"
requires-python = ">=3.11"
description = "Mock EAM (asset/work-order) business system exposing OData v4 + REST endpoints, a Released webhook, and SQLite persistence. See CLAUDE.md section 4.1. Not yet built (build sequence step 2)."
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eam"]
