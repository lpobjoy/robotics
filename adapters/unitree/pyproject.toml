[project]
name = "unitree"
version = "0.1.0"
requires-python = ">=3.11"
description = "Unitree Go2 adapter, split in two: SDK-based high-level control (BUILT_AGAINST_SDK_TESTED_WITH_FAKE) and unitree_mujoco sim2sim locomotion (RUN_IN_SIM). Own container — never shares an image with the ROS 2 adapter. See CLAUDE.md section 4.5. Not yet built (step 11)."
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitree"]
