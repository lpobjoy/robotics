[project]
name = "robot-router"
version = "0.1.0"
requires-python = ">=3.11"
description = "Agent-first integration demo between a mock EAM and heterogeneous robot fleets. See CLAUDE.md."

[tool.uv.workspace]
members = [
    "eam",
    "worldmodel",
    "agent",
    "router",
    "mcp_server",
    "telemetry",
    "audit",
    "identity",
    "adapters/vda5050_amr",
    "adapters/unitree",
    "adapters/spot",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Every workspace member has its own tests/ dir with no __init__.py, and
# several will end up with same-named test files (test_api.py, and so on).
# importlib mode keys each test module by its full path instead of by
# basename, so that doesn't collide.
addopts = "--import-mode=importlib"
