name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy --strict on router, agent, worldmodel)
        run: uv run mypy --strict router agent worldmodel

      - name: Test
        run: uv run pytest

  # Added at build-sequence step 7 (CLAUDE.md section 6): a headless Gazebo
  # run of one full work order through the vda5050_amr adapter. Not built yet.
