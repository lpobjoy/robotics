apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: robot-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      containers:
        - name: console
          image: robot-router/console:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: PORT
              value: "5173"
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: robot-router
spec:
  selector:
    app: console
  ports:
    - port: 5173
      targetPort: 5173
