apiVersion: apps/v1
kind: Deployment
metadata:
  name: eam
  namespace: robot-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eam
  template:
    metadata:
      labels:
        app: eam
    spec:
      containers:
        - name: eam
          image: robot-router/eam:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: CONSOLE_ORIGIN
              value: "http://localhost:5173"
---
apiVersion: v1
kind: Service
metadata:
  name: eam
  namespace: robot-router
spec:
  selector:
    app: eam
  ports:
    - port: 8000
      targetPort: 8000
