apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: robot-router
resources:
  - namespace.yaml
  - mosquitto.yaml
  - eam.yaml
  - mcp-server.yaml
  - telemetry.yaml
  - console.yaml
# agent-job.yaml is deliberately not listed here -- it's a one-shot Job
# template applied by hand per work order, not part of the always-on
# set. See its own header comment.
