[project]
name = "mcp_server"
version = "0.1.0"
requires-python = ">=3.11"
description = "MCP server wrapping the router and EAM as typed tools for the agent. The agent must never call adapters directly. See CLAUDE.md section 4.3. Not yet built (step 6)."
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "networkx>=3.3",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "eam",
    "worldmodel",
    "router",
    "audit",
]

[dependency-groups]
dev = [
    "pydantic-ai",
    "anyio",
]

[tool.uv.sources]
eam = { workspace = true }
worldmodel = { workspace = true }
router = { workspace = true }
audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
